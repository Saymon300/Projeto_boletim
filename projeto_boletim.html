<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="projeto_boletim.css">
    <title>Boletim do Aluno</title>
</head>
<body>
    <header><h1>Boletim do Aluno</h1></header>

    <section>
        <div class="info">
            <p><strong>Nome:</strong> <span id="nomeAluno"></span></p>
            <p><strong>Idade:</strong> <span id="idadeAluno"></span></p>
        </div>

        <div>
            <p>Notas</p>
            <ul id="listaNotas"></ul>
        </div>

        <div>
            <label for="txtNota">Adicionar nota:</label>
            <input type="number" id="txtNota" min="0" max="10" step="0.1">
            <button type="button" id="btnAdicionarNota">Adicionar</button>
        </div>

        <div class="resumo">
            <p>Média: <span id="media"></span></p>
            <p>Situação: <span id="situacao"></span></p>
        </div>
    </section>

    <script src="projeto_boletim.js"></script>
</body>
</html>
